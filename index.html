
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Crew - Team Section</title>

    <link rel="stylesheet" href="style.css">

    
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

</head>

<body>

    <main class="crew-section">

        
        <div class="heading">
            <h1>Our Crew</h1>

            <p>
                Samples will show you the feeling on how to play around using the
                <br class="desktop-break">
                components in the website building process.
            </p>
        </div>


        
        <section class="team-container">

            
            <div class="team-card">

                <img src="images/samantha.jpg"
                     alt="Samantha Gimson"
                     class="profile-image">

                <h2>Samantha Gimson</h2>

                <div class="social-icons">
                    <a href="#" aria-label="Twitter">
                        <i class="fa fa-twitter"></i>
                    </a>

                    <a href="#" aria-label="Facebook">
                        <i class="fa fa-facebook-square"></i>
                    </a>

                    <a href="#" aria-label="Dribbble">
                        <i class="fa fa-dribbble"></i>
                    </a>
                </div>

            </div>


           
            <div class="team-card">

                <img src="images/evan.jpg"
                     alt="Evan Barrington"
                     class="profile-image">

                <h2>Evan Barrington</h2>

                <div class="social-icons">
                    <a href="#" aria-label="Twitter">
                        <i class="fa fa-twitter"></i>
                    </a>

                    <a href="#" aria-label="Facebook">
                        <i class="fa fa-facebook-square"></i>
                    </a>

                    <a href="#" aria-label="Behance">
                        <i class="fa fa-behance"></i>
                    </a>
                </div>

            </div>


            
            <div class="team-card">

                <img src="images/brian.jpg"
                     alt="Brian Oakman"
                     class="profile-image">

                <h2>Brian Oakman</h2>

                <div class="social-icons">
                    <a href="#" aria-label="Twitter">
                        <i class="fa fa-twitter"></i>
                    </a>

                    <a href="#" aria-label="Git">
                        <i class="fa fa-git"></i>
                    </a>
                </div>

            </div>

        </section>


        <!-- Bottom Button -->
        <div class="button-container">

            <a href="#" class="team-button">
                View Our Team
            </a>

        </div>

    </main>

</body>
</html>
